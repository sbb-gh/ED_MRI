# Default configuration for edmri-optimise.
# Copy this file and modify the paths for your optimisation experiments.

# ============================================================
# Paths
# ============================================================

paths:
  root: null

# ============================================================
# Input data
# ============================================================

data:
  input: ${paths.root}/examples/data/sandi/superdesign_signals.npy
  target: ${paths.root}/examples/data/sandi/superdesign_targets.npy
  superdesign: ${paths.root}/examples/data/sandi/superdesign_protocol.txt
  mask: null                  # Optional NIfTI mask

# ============================================================
# Acquisition optimisation
# ============================================================

optimisation:
  method: tadred             # CRLB in future?
  protocol_size: 0.25        # Fraction of measurements to retain
  n_iterations: 5            # Number of TADRED reduction stages
  random_state: 42

# ============================================================
# TADRED training
# ============================================================

training:
  network:
    num_units_score: [1000, 1000]
    num_units_task: [1000, 1000]

  optimiser:
    learning_rate: 0.001
    batch_size: 256

# ============================================================
# Output
# ============================================================

output:
  directory: ${paths.root}/results/optimisation
