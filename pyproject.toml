[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edmri"
version = "0.1.0"
description = "Experimental design for quantitative and diffusion MRI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "nibabel",
    "omegaconf",
    "hydra-core",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
edmri-optimise = "edmri.cli:optimise_cli"
edmri-apply = "edmri.cli:apply_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["edmri*"]